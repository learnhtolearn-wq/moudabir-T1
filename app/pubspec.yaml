name: moudabbir
description: "Moudabbir — offline-first personal finance manager."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management / navigation
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0

  # Local encrypted database
  drift: ^2.34.3
  sqlite3: ^3.5.0
  path_provider: ^2.1.5
  path: ^1.9.0

  # Security: PIN + biometric auth, secure key storage
  local_auth: ^3.0.2
  flutter_secure_storage: ^10.3.1

  # Local-only scheduled notifications (no push/server)
  flutter_local_notifications: ^22.2.0

  # i18n FR/AR/EN with RTL
  easy_localization: ^3.0.8

  cupertino_icons: ^1.0.8
  crypto: ^3.0.6

  # Reports charts (category breakdown, income vs expense)
  fl_chart: ^1.2.0

  # Local backup/restore (share/pick the encrypted DB file)
  share_plus: 12.0.0
  file_picker: 8.3.3

  # Notification scheduling (local time zone aware)
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.4.13

# Encrypted SQLite via SQLite3MultipleCiphers (SQLCipher successor).
# Replaces the now-EOL sqlcipher_flutter_libs package — this is drift's
# current documented path (drift.simonbinder.eu/docs/platforms/encryption).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
